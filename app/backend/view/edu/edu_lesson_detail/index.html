{layout name="layout/main" /}
<div class="layui-card"><div class="layui-card-header"><h3 class="layui-card-title">消课明细</h3></div><div class="layui-card-body"><div class="layui-form layui-form-pane" lay-filter="search"><div class="layui-form-item"><div class="layui-inline"><label class="layui-form-label">关键词</label><div class="layui-input-inline" style="width:280px;"><input type="text" name="keyword" placeholder="请输入学生、日期或备注" class="layui-input"></div></div><div class="layui-inline"><button class="layui-btn layui-btn-primary" lay-submit lay-filter="search">搜索</button><button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset">重置</button></div></div></div><table class="layui-hide" id="table" lay-filter="table"></table></div></div>
<script type="text/html" id="action"><button class="layui-btn layui-btn-xs" lay-event="view">查看</button></script>
<script type="text/html" id="attendanceTpl">
    {{# if(d.attendance_status == 2){ }}
    <span style="color:#ef4444;font-weight:700;">已请假</span>
    {{# } else { }}
    <span>已到课</span>
    {{# } }}
</script>
<script>layui.use(['table','form','layer'],function(){var table=layui.table,form=layui.form,layer=layui.layer,tableId='EduLessonDetailTable';function reload(reset,where){table.reload(tableId,{page:reset?{curr:1}:undefined,where:where||undefined});}function openForm(title,url){layer.open({type:2,title:title,content:url,area:['900px','720px'],maxmin:true});}table.render({elem:'#table',id:tableId,url:'/backend/edu/edu_lesson_detail/index',cols:[[{field:'class_date',title:'上课日期',width:110},{field:'student_name',title:'学生',width:100},{field:'class_name',title:'班级',width:140},{field:'teacher_name',title:'老师',width:100},{field:'deduct_hours',title:'消耗课时',width:100},{field:'student_total_hours',title:'总课时',width:100},{field:'student_remaining_hours',title:'剩余课时',width:110},{field:'attendance_text',title:'出勤',width:100,templet:'#attendanceTpl'},{field:'remark',title:'备注',minWidth:180},{toolbar:'#action',title:'操作',width:90,fixed:'right'}]],page:true});table.on('tool(table)',function(obj){if(obj.event==='view'){openForm('查看消课明细','/backend/edu/edu_lesson_detail/view?id='+obj.data.id);}});form.on('submit(search)',function(data){reload(true,data.field);return false;});form.on('submit(reset)',function(){form.val('search',{keyword:''});reload(true,{});return false;});});</script>
