{layout name="layout/main" /}
<div class="layui-card"><div class="layui-card-header"><h3 class="layui-card-title">查看消课明细</h3></div><div class="layui-card-body"><form class="layui-form layui-form-pane"><div class="layui-form-item"><label class="layui-form-label">学生</label><div class="layui-input-block"><input type="text" value="{$formData.student_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">班级</label><div class="layui-input-block"><input type="text" value="{$formData.class_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">老师</label><div class="layui-input-block"><input type="text" value="{$formData.teacher_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">上课日期</label><div class="layui-input-block"><input type="text" value="{$formData.class_date|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">消耗课时</label><div class="layui-input-block"><input type="text" value="{$formData.deduct_hours|default='0'}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">总课时</label><div class="layui-input-block"><input type="text" value="{$formData.student_total_hours|default='0'}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">剩余课时</label><div class="layui-input-block"><input type="text" value="{$formData.student_remaining_hours|default='0'}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">出勤状态</label><div class="layui-input-block">{if isset($formData['attendance_status']) && (int)$formData['attendance_status']===2}<input type="text" value="已请假" class="layui-input" style="color:#ef4444;font-weight:700;" readonly>{else /}<input type="text" value="{$formData.attendance_text|default=''}" class="layui-input" readonly>{/if}</div></div><div class="layui-form-item layui-form-text"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea class="layui-textarea" readonly>{$formData.remark|default=''}</textarea></div></div><div class="layui-form-item"><div class="layui-input-block"><button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">关闭</button></div></div></form></div></div>
