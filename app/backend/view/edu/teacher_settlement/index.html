{layout name="layout/main" /}
<style>
    #table + .layui-table-view .layui-table-tool-temp {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-right: 0;
    }

    #table + .layui-table-view .layui-table-tool-self {
        position: static;
        float: none;
        margin: 0;
        display: inline-flex;
        align-items: flex-end;
        align-self: flex-end;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline {
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container > * + * {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline + .layui-inline,
    #table + .layui-table-view .layui-table-tool-self .layui-btn + .layui-btn {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn {
        height: 30px;
        line-height: 30px;
        padding: 0 10px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn .layui-icon {
        margin-right: 4px;
    }

    .table-batch-delete-disabled {
        opacity: .45;
        cursor: not-allowed;
        pointer-events: none;
    }

    .table-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
    }

    .table-action-group .layui-btn {
        margin: 0;
    }
</style>
<div class="layui-card">
    <div class="layui-card-header"><h3 class="layui-card-title">课时结算</h3></div>
    <div class="layui-card-body">
        <div class="layui-form layui-form-pane" lay-filter="search">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">关键词</label>
                    <div class="layui-input-inline" style="width:300px;">
                        <input type="text" name="keyword" placeholder="请输入结算单号、教师、月份或备注" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset"><i class="layui-icon layui-icon-refresh"></i> 重置</button>
                </div>
            </div>
        </div>
        <table class="layui-hide" id="table" lay-filter="table"></table>
    </div>
</div>
<script type="text/html" id="toolbar"><div class="layui-btn-container"><button class="layui-btn layui-btn-sm" lay-event="add"><i class="layui-icon layui-icon-add-circle"></i> 生成结算单</button><button class="layui-btn layui-btn-sm layui-btn-danger table-batch-delete-disabled" lay-event="batchDelete" id="teacherSettlementBatchDeleteBtn"><i class="layui-icon layui-icon-delete"></i> 批量删除</button></div></script>
<script type="text/html" id="settlement_status_tpl">
    {{# if(d.settlement_status == 1){ }}<span style="color:#d97706;font-weight:700;">待生成</span>{{# } }}
    {{# if(d.settlement_status == 2){ }}<span style="color:#2563eb;font-weight:700;">待确认</span>{{# } }}
    {{# if(d.settlement_status == 3){ }}<span style="color:#16a34a;font-weight:700;">已确认</span>{{# } }}
    {{# if(d.settlement_status == 4){ }}<span style="color:#7c3aed;font-weight:700;">已发放</span>{{# } }}
    {{# if(d.settlement_status == 5){ }}<span style="color:#6b7280;font-weight:700;">已作废</span>{{# } }}
</script>
<script type="text/html" id="action"><div class="table-action-group"><button class="layui-btn layui-btn-xs" lay-event="view">查看</button><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button></div></script>
<script>
layui.use(['table','form','layer','jquery'], function(){
    var table = layui.table, form = layui.form, layer = layui.layer, $ = layui.jquery;
    var tableId = 'TeacherSettlementTable';
    function parseResponse(raw){
        if(!raw){ return null; }
        if(typeof raw === 'object'){ return raw; }
        var text = $.trim(String(raw));
        if(!text){ return null; }
        try { return JSON.parse(text); } catch (e) {}
        var match = text.match(/\{[\s\S]*"code"\s*:\s*[01][\s\S]*\}/);
        if(match){
            try { return JSON.parse(match[0]); } catch (e) {}
        }
        return null;
    }

    function relocateDefaultToolbar(){ var $tableView = $('#table').next('.layui-table-view'); var $toolbar = $tableView.find('.layui-table-tool-self'); var $anchor = $('#teacherSettlementBatchDeleteBtn'); if(!$tableView.length || !$toolbar.length || !$anchor.length){ return; } $toolbar.insertAfter($anchor); }
    function reloadTable(resetPage){ table.reload(tableId, resetPage ? {page:{curr:1}} : {}); }
    function openForm(title, url){ layer.open({type:2,title:title,content:url,area:['1040px','780px'],maxmin:true,shadeClose:false,end:function(){reloadTable(false);}}); }
    function updateBatchDeleteButtonState(){ var selected = table.checkStatus(tableId).data || []; $('#teacherSettlementBatchDeleteBtn').toggleClass('table-batch-delete-disabled', !selected.length); }
    function deleteItems(ids, done, options){ options = options || {}; $.ajax({ url:'/backend/edu/teacher_settlement/delete', type:'POST', headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json'}, data:{ids:ids.join(',')}, dataType:'text', success:function(res){ var parsed = parseResponse(res); if(parsed && Number(parsed.code) === 1){ layer.msg(options.successText || parsed.msg || '删除成功',{icon:1},function(){reloadTable(false); updateBatchDeleteButtonState(); if(typeof done === 'function') done(true);}); } else { layer.msg((parsed && parsed.msg) || '删除失败',{icon:2}); if(typeof done === 'function') done(false); } }, error:function(xhr){ var parsed = parseResponse(xhr && xhr.responseText ? xhr.responseText : ''); layer.msg((parsed && parsed.msg) || '删除失败，请稍后重试',{icon:2}); if(typeof done === 'function') done(false); } }); }
    table.render({ elem:'#table', id:tableId, url:'/backend/edu/teacher_settlement/index', toolbar:'#toolbar', defaultToolbar:['filter','exports','print'], cols:[[
        {type:'checkbox'},
        {field:'settlement_no', title:'结算单号', width:150},
        {field:'teacher_name', title:'教师', width:120},
        {field:'settlement_month', title:'月份', width:100},
        {field:'hour_price', title:'单价', width:90},
        {field:'should_hours', title:'应结课时', width:100},
        {field:'adjust_hours', title:'调整课时', width:100},
        {field:'final_hours', title:'最终课时', width:100},
        {field:'deduct_amount', title:'扣减金额', width:100},
        {field:'reward_amount', title:'奖励金额', width:100},
        {field:'final_amount', title:'最终金额', width:110},
        {field:'settlement_status', title:'状态', width:100, templet:'#settlement_status_tpl'},
        {toolbar:'#action', title:'操作', width:180, fixed:'right'}
    ]], page:true, limit:10, limits:[10,20,30,50], text:{none:'暂无结算单'}, done:function(){ updateBatchDeleteButtonState(); relocateDefaultToolbar(); }});
    table.on('toolbar(table)', function(obj){ if(obj.event === 'add'){ openForm('生成结算单', '/backend/edu/teacher_settlement/add'); } else if(obj.event === 'batchDelete'){ var selected = table.checkStatus(tableId).data || []; if(!selected.length){ updateBatchDeleteButtonState(); return; } var ids = selected.map(function(item){ return item.id; }); layer.confirm('确定要批量删除选中的 ' + ids.length + ' 张结算单吗？', function(index){ deleteItems(ids, function(){ layer.close(index); }, {successText:'已删除 ' + ids.length + ' 条数据'}); }); } });
    table.on('checkbox(table)', function(){ updateBatchDeleteButtonState(); });
    table.on('tool(table)', function(obj){ var data = obj.data; if(obj.event === 'view'){ openForm('查看结算单', '/backend/edu/teacher_settlement/view?id=' + data.id); } if(obj.event === 'edit'){ openForm('编辑结算单', '/backend/edu/teacher_settlement/edit?id=' + data.id); } if(obj.event === 'delete'){ layer.confirm('确定删除这张结算单吗？', function(index){ deleteItems([data.id], function(){ layer.close(index); }); }); } });
    form.on('submit(search)', function(data){ table.reload(tableId, {where:data.field, page:{curr:1}}); return false; });
    form.on('submit(reset)', function(){ form.val('search', {keyword:''}); table.reload(tableId, {where:{}, page:{curr:1}}); return false; });
    window.__refreshTeacherSettlementTable = function(resetPage){ reloadTable(!!resetPage); };
});
</script>
