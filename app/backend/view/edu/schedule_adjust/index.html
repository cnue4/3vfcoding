{layout name="layout/main" /}
<style>
    #table + .layui-table-view .layui-table-tool-temp {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-right: 0;
    }

    #table + .layui-table-view .layui-table-tool-self {
        position: static;
        float: none;
        margin: 0;
        display: inline-flex;
        align-items: flex-end;
        align-self: flex-end;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline {
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container > * + * {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline + .layui-inline,
    #table + .layui-table-view .layui-table-tool-self .layui-btn + .layui-btn {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn {
        height: 30px;
        line-height: 30px;
        padding: 0 10px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn .layui-icon {
        margin-right: 4px;
    }

    .table-batch-delete-disabled {
        opacity: .45;
        cursor: not-allowed;
        pointer-events: none;
    }

    .table-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
    }

    .table-action-group .layui-btn {
        margin: 0;
    }
</style>
<div class="layui-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">调课 / 补课 / 停课</h3>
    </div>
    <div class="layui-card-body">
        <div class="layui-form layui-form-pane" lay-filter="search">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">关键词</label>
                    <div class="layui-input-inline" style="width:280px;">
                        <input type="text" name="keyword" placeholder="请输入单号、班级、学生、教师或原因" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset"><i class="layui-icon layui-icon-refresh"></i> 重置</button>
                </div>
            </div>
        </div>
        <table class="layui-hide" id="table" lay-filter="table"></table>
    </div>
</div>
<script type="text/html" id="toolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add"><i class="layui-icon layui-icon-add-circle"></i> 添加调整单</button>
        <button class="layui-btn layui-btn-sm layui-btn-danger table-batch-delete-disabled" lay-event="batchDelete" id="scheduleAdjustBatchDeleteBtn"><i class="layui-icon layui-icon-delete"></i> 批量删除</button>
    </div>
</script>

    {{# if(d.adjust_type == 2){ }}<span class="layui-badge layui-bg-green">补课</span>{{# } }}

    {{# if(d.business_status == 2){ }}<span style="color:#2563eb;font-weight:700;">已通过</span>{{# } }}

<script type="text/html" id="action">
    <div class="table-action-group">
        <button class="layui-btn layui-btn-xs" lay-event="view">查看</button>
        <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button>
    </div>
</script>
<script>
layui.use(['table','form','layer'], function(){
    var table = layui.table, form = layui.form, layer = layui.layer;
    var tableId = 'ScheduleAdjustTable';

    function relocateDefaultToolbar(){
        var $tableView = $('#table').next('.layui-table-view');
        var $toolbar = $tableView.find('.layui-table-tool-self');
        var $anchor = $('#scheduleAdjustBatchDeleteBtn');
        if(!$tableView.length || !$toolbar.length || !$anchor.length){
            return;
        }
        $toolbar.insertAfter($anchor);
    }

    function reloadTable(resetPage){
        table.reload(tableId, resetPage ? {page:{curr:1}} : {});
    }

    function openForm(title, url){
        layer.open({type:2,title:title,content:url,area:['980px','760px'],maxmin:true,shadeClose:false,end:function(){reloadTable(false);}});
    }

    function updateBatchDeleteButtonState(){
        var selected = table.checkStatus(tableId).data || [];
        $('#scheduleAdjustBatchDeleteBtn').toggleClass('table-batch-delete-disabled', !selected.length);
    }

    function deleteItems(ids, done, options){
        options = options || {};
        $.post('/backend/edu/schedule_adjust/delete', {ids:ids.join(',')}, function(res){
            if(res.code === 1){ layer.msg(options.successText || res.msg || '删除成功',{icon:1},function(){reloadTable(false); updateBatchDeleteButtonState(); if(typeof done === 'function') done(true);}); }
            else { layer.msg((res && res.msg) || '删除失败',{icon:2}); if(typeof done === 'function') done(false); }
        }, 'json').fail(function(){ layer.msg('删除失败，请稍后重试',{icon:2}); if(typeof done === 'function') done(false); });
    }

    table.render({
        elem:'#table',
        id:tableId,
        url:'/backend/edu/schedule_adjust/index',
        toolbar:'#toolbar',
        defaultToolbar:['filter','exports','print'],
        cols:[[ 
            {type:'checkbox'},
            {field:'id', title:'ID', width:70},
            {field:'adjust_no', title:'调整单号', width:140},
            {field:'adjust_type', title:'类型', width:90, templet:'#adjust_type_tpl'},
            {field:'business_status', title:'状态', width:90, templet:'#status_tpl'},
            {field:'class_name', title:'班级', width:150},
            {field:'student_name', title:'学生', minWidth:150},
            {field:'teacher_name', title:'原教师', width:110},
            {field:'replace_teacher_name', title:'代课教师', width:110},
            {field:'lesson_owner_text', title:'课时归属', width:180, templet:'#lesson_owner_tpl'},
            {field:'origin_class_date', title:'原日期', width:110},
            {field:'target_class_date', title:'目标日期', width:110},
            {field:'deduct_hours', title:'扣减课时', width:100},
            {field:'compensate_hours', title:'补回课时', width:100},
            {field:'reason', title:'原因', minWidth:220},
            {toolbar:'#action', title:'操作', width:180, fixed:'right'}
        ]],
        page:true,
        limit:10,
        limits:[10,20,30,50],
        text:{none:'暂无调整记录'},
        done:function(){ updateBatchDeleteButtonState(); relocateDefaultToolbar(); }
    });

    table.on('toolbar(table)', function(obj){
        if(obj.event === 'add'){
            openForm('添加调整单', '/backend/edu/schedule_adjust/add');
        } else if(obj.event === 'batchDelete'){
            var selected = table.checkStatus(tableId).data || [];
            if(!selected.length){ updateBatchDeleteButtonState(); return; }
            var ids = selected.map(function(item){ return item.id; });
            layer.confirm('确定要批量删除选中的 ' + ids.length + ' 条调整记录吗？', function(index){
                deleteItems(ids, function(){ layer.close(index); }, {successText:'已删除 ' + ids.length + ' 条数据'});
            });
        }
    });

    table.on('checkbox(table)', function(){
        updateBatchDeleteButtonState();
    });

    table.on('tool(table)', function(obj){
        var data = obj.data;
        if(obj.event === 'view'){ openForm('查看调整单', '/backend/edu/schedule_adjust/view?id=' + data.id); }
        if(obj.event === 'edit'){ openForm('编辑调整单', '/backend/edu/schedule_adjust/edit?id=' + data.id); }
        if(obj.event === 'delete'){
            layer.confirm('确定删除这条调整记录吗？', function(index){
                deleteItems([data.id], function(){ layer.close(index); });
            });
        }
    });

    form.on('submit(search)', function(data){ table.reload(tableId, {where:data.field, page:{curr:1}}); return false; });
    form.on('submit(reset)', function(){ form.val('search', {keyword:''}); table.reload(tableId, {where:{}, page:{curr:1}}); return false; });
    window.__refreshScheduleAdjustTable = function(resetPage){ reloadTable(!!resetPage); };
});
</script>
