{layout name="layout/main" /}
<style>
    #table + .layui-table-view .layui-table-tool-temp {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-right: 0;
    }

    #table + .layui-table-view .layui-table-tool-self {
        position: static;
        float: none;
        margin: 0;
        display: inline-flex;
        align-items: flex-end;
        align-self: flex-end;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline {
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container > * + * {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline + .layui-inline,
    #table + .layui-table-view .layui-table-tool-self .layui-btn + .layui-btn {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn {
        height: 30px;
        line-height: 30px;
        padding: 0 10px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn .layui-icon {
        margin-right: 4px;
    }

    .student-batch-delete-disabled {
        opacity: .45;
        cursor: not-allowed;
        pointer-events: none;
    }

    .table-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
    }

    .table-action-group .layui-btn {
        margin: 0;
    }
</style>
<div class="layui-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">学生管理</h3>
    </div>
    <div class="layui-card-body">
        <div class="layui-form layui-form-pane" lay-filter="search">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">搜索</label>
                    <div class="layui-input-inline">
                        <input type="text" name="keyword" placeholder="请输入姓名、学号、联系人或电话" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="search">
                        <i class="layui-icon layui-icon-search"></i> 搜索
                    </button>
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset">
                        <i class="layui-icon layui-icon-refresh"></i> 重置
                    </button>
                </div>
            </div>
        </div>
        <table class="layui-hide" id="table" lay-filter="table"></table>
    </div>
</div>
<script type="text/html" id="toolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon layui-icon-add-circle"></i> 添加学生
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="import" data-url="/backend/edu/student/add?import_mode=1">
            <i class="layui-icon layui-icon-upload-drag"></i> 批量导入
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-danger student-batch-delete-disabled" lay-event="batchDelete" id="studentBatchDeleteBtn">
            <i class="layui-icon layui-icon-delete"></i> 批量删除
        </button>
    </div>
</script>
<script type="text/html" id="student_status">
    {{# if(d.student_status == 1){ }}
    <span class="layui-badge layui-bg-green">在读</span>
    {{# } else if(d.student_status == 2) { }}
    <span class="layui-badge layui-bg-orange">休学</span>
    {{# } else if(d.student_status == 4) { }}
    <span class="layui-badge layui-bg-blue">请假</span>
    {{# } else { }}
    <span class="layui-badge layui-bg-gray">退学</span>
    {{# } }}
</script>
<script type="text/html" id="status">
    {{# if(d.status == 1){ }}
    <span class="layui-badge layui-bg-green">正常</span>
    {{# } else { }}
    <span class="layui-badge layui-bg-red">禁用</span>
    {{# } }}
</script>
<script type="text/html" id="action">
    <button class="layui-btn layui-btn-xs" lay-event="view">查看</button>
    <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</button>
    <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button>
</script>
<script>
    layui.use(['table', 'form', 'layer'], function() {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var tableId = 'StudentTable';

        function relocateDefaultToolbar() {
            var $tableView = $('#table').next('.layui-table-view');
            var $toolbar = $tableView.find('.layui-table-tool-self');
            var $anchor = $('#studentBatchDeleteBtn');
            if (!$tableView.length || !$toolbar.length || !$anchor.length) {
                return;
            }
            $toolbar.insertAfter($anchor);
        }

        function reloadTable(resetPage) {
            var options = {};
            if (resetPage) {
                options.page = {curr: 1};
            }
            table.reload(tableId, options);
        }

        function openForm(title, url, area) {
            layer.open({
                type: 2,
                title: title,
                content: url,
                area: area || ['92vw', '92vh'],
                maxmin: true,
                shadeClose: false,
                end: function() {
                    reloadTable(false);
                }
            });
        }

        function updateBatchDeleteButtonState() {
            var selected = table.checkStatus(tableId).data || [];
            var disabled = !selected.length;
            $('#studentBatchDeleteBtn').toggleClass('student-batch-delete-disabled', disabled);
        }

        function deleteStudents(ids, done, options) {
            options = options || {};
            $.post('/backend/edu/student/delete', {ids: ids.join(',')}, function(res) {
                if (res.code === 1) {
                    var successText = options.successText || res.msg || '删除成功';
                    layer.msg(successText, {icon: 1}, function() {
                        reloadTable(false);
                        updateBatchDeleteButtonState();
                        if (typeof done === 'function') {
                            done(true);
                        }
                    });
                } else {
                    layer.msg((res && res.msg) || '删除失败', {icon: 2});
                    if (typeof done === 'function') {
                        done(false);
                    }
                }
            }, 'json').fail(function() {
                layer.msg('删除失败，请稍后重试', {icon: 2});
                if (typeof done === 'function') {
                    done(false);
                }
            });
        }

        table.render({
            elem: '#table',
            id: tableId,
            url: '/backend/edu/student/index',
            method: 'get',
            parseData: function(res) {
                if (res && Number(res.code) !== 0) {
                    layer.msg((res && res.msg) || '请求异常', {icon: 2});
                    return {
                        code: Number(res.code || 1),
                        msg: res.msg || '请求异常',
                        count: 0,
                        data: []
                    };
                }
                return res;
            },
            toolbar: '#toolbar',
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                {type: 'checkbox'},
                {field: 'id', title: 'ID', width: 70},
                {field: 'student_no', title: '学号', width: 130},
                {field: 'name', title: '姓名', width: 110},
                {field: 'gender_text', title: '性别', width: 80},
                {field: 'email', title: '邮箱', minWidth: 180},
                {field: 'contact_name', title: '联系人', width: 110},
                {field: 'phone', title: '联系电话', width: 140},
                {field: 'class_name', title: '班级', width: 140},
                {field: 'course_name', title: '课程', width: 140},
                {field: 'total_hours', title: '总课时', width: 100},
                {field: 'used_hours', title: '已用课时', width: 100},
                {field: 'remaining_hours', title: '剩余课时', width: 110},
                {field: 'enrollment_gift_hours', title: '续费赠课', width: 110},
                {field: 'change_gift_hours', title: '异动赠课', width: 110},
                {field: 'delete_gift_hours', title: '删除赠课', width: 110},
                {field: 'gift_hours', title: '总赠课', width: 100},
                {field: 'student_status', title: '学生状态', width: 100, templet: '#student_status'},
                {field: 'status', title: '系统状态', width: 100, templet: '#status'},
                {field: 'create_time', title: '创建时间', width: 170},
                {toolbar: '#action', title: '操作', width: 180, fixed: 'right'}
            ]],
            page: true,
            limit: 10,
            limits: [10, 20, 30, 50],
            text: { none: '暂无数据' },
            done: function() {
                updateBatchDeleteButtonState();
                relocateDefaultToolbar();
            }
        });

        table.on('toolbar(table)', function(obj) {
            if (obj.event === 'add') {
                openForm('添加学生', '/backend/edu/student/add');
            } else if (obj.event === 'import') {
                openForm('批量导入学生', $(obj.event === 'import' ? '[lay-event="import"]' : '').data('url') || '/backend/edu/student/add?import_mode=1', ['760px', '520px']);
            } else if (obj.event === 'batchDelete') {
                var checkStatus = table.checkStatus(tableId);
                var selected = checkStatus.data || [];
                if (!selected.length) {
                    updateBatchDeleteButtonState();
                    return;
                }
                var ids = selected.map(function(item) { return item.id; });
                layer.confirm('确定要批量删除选中的 ' + ids.length + ' 个学生吗？', function(index) {
                    deleteStudents(ids, function() {
                        layer.close(index);
                    }, {
                        successText: '已删除 ' + ids.length + ' 条数据'
                    });
                });
            }
        });

        table.on('checkbox(table)', function() {
            updateBatchDeleteButtonState();
        });

        table.on('tool(table)', function(obj) {
            var event = obj.event;
            var data = obj.data;
            if (event === 'view') {
                openForm('查看学生', '/backend/edu/student/view?id=' + data.id);
            } else if (event === 'edit') {
                openForm('编辑学生', '/backend/edu/student/edit?id=' + data.id);
            } else if (event === 'delete') {
                layer.confirm('确定要删除这个学生吗？', function(index) {
                    deleteStudents([data.id], function() {
                        layer.close(index);
                    });
                });
            }
        });

        form.on('submit(search)', function(data) {
            table.reload(tableId, { where: data.field, page: {curr: 1} });
            return false;
        });

        form.on('submit(reset)', function() {
            form.val('search', { keyword: '' });
            table.reload(tableId, { where: {}, page: {curr: 1} });
            return false;
        });

        window.addEventListener('focus', function() {
            reloadTable(false);
        });

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                reloadTable(false);
            }
        });

        window.__refreshStudentTable = function(resetPage) {
            reloadTable(!!resetPage);
        };
    });
</script>
