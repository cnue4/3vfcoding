{layout name="layout/main" /}
<style>
    html, body {
        height: 100%;
        overflow: auto;
        background: #f5f7fb;
    }
    .student-view-card {
        min-height: 100%;
    }
    .student-view-card .layui-card-body {
        max-height: calc(100vh - 90px);
        overflow-y: auto;
        box-sizing: border-box;
    }
    @media (max-width: 640px) {
        .student-view-card .layui-form-label {
            width: auto;
            float: none;
            display: block;
            margin-bottom: 8px;
        }
        .student-view-card .layui-input-block {
            margin-left: 0;
        }
    }
</style>
<div class="layui-card student-view-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">查看学生信息</h3>
    </div>
    <div class="layui-card-body">
        <form class="layui-form layui-form-pane">
            <div class="layui-form-item">
                <label class="layui-form-label">学号</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.student_no|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">姓名</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.name|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">性别</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.gender_text|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">邮箱</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.email|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">地址</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.address|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">联系人</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.contact_name|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">联系电话</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.phone|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">班级</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.class_name|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">课程</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.course_name|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">总课时</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.total_hours|default='0'}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">已用课时</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.used_hours|default='0'}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">剩余课时</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.remaining_hours|default='0'}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">续费赠课</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.enrollment_gift_hours|default='0'}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">异动赠课</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.change_gift_hours|default='0'}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">删除赠课</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.delete_gift_hours|default='0'}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">总赠课</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.gift_hours|default='0'}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">学生状态</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.student_status_text|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">学生备注</label>
                <div class="layui-input-block">
                    <textarea class="layui-textarea" readonly>{$formData.remark|default=''}</textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">系统状态</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.status_text|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">创建时间</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.create_time|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">更新时间</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.update_time|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">
                        <i class="layui-icon layui-icon-close"></i> 关闭
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
