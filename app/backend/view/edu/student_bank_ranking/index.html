{layout name="layout/main" /}
<style>
:root{--bank-bg:#0a0f1f;--bank-card:#111935;--bank-soft:#19254b;--bank-line:rgba(148,163,184,.15);--bank-text:#e8eefc;--bank-muted:#97abd1;--bank-gold:#f3c45a;--bank-cyan:#66d9ef;--bank-pink:#ff77c8;}
html,body{background:radial-gradient(circle at top,#1a2550 0,#0b1020 45%,#070b15 100%);min-height:100%;}.bank-ranking-page{padding:18px;}.bank-hero{position:relative;overflow:hidden;padding:24px;border-radius:26px;background:linear-gradient(135deg,#dff1ff 0%,#cfe7ff 52%,#eaf4ff 100%);border:1px solid rgba(116,164,255,.28);box-shadow:0 18px 60px rgba(76,120,196,.18);}.bank-hero:before{content:'';position:absolute;right:-80px;top:-80px;width:240px;height:240px;background:radial-gradient(circle,rgba(124,174,255,.26),rgba(124,174,255,0));}.bank-hero h1{margin:0;color:#17325f;font-size:30px;font-weight:900;letter-spacing:1px;}.bank-hero p{margin:10px 0 0;color:#58739e;line-height:1.8;}.bank-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;margin-top:18px;}.bank-panel,.bank-table-card{background:rgba(17,25,53,.9);border:1px solid var(--bank-line);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);}.bank-panel{padding:18px;}.panel-title{font-size:18px;font-weight:800;color:var(--bank-text);margin-bottom:14px;}.champion{padding:18px;border-radius:20px;background:linear-gradient(135deg,rgba(243,196,90,.16),rgba(102,217,239,.08));border:1px solid rgba(243,196,90,.28);}.champion .crown{font-size:36px;}.champion .name{margin-top:10px;font-size:22px;font-weight:900;color:#fff;}.champion .class{margin-top:6px;color:var(--bank-muted);}.champion .balance{margin-top:18px;font-size:34px;font-weight:900;color:var(--bank-gold);}.mini-list{margin-top:16px;display:flex;flex-direction:column;gap:10px;}.mini-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);color:#d8e3fb;}.mini-rank{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#dbeafe;color:#0f172a;font-weight:800;margin-right:10px;}.bank-table-card{padding:16px;}.layui-table-view,.layui-table,.layui-table-header,.layui-table-body,.layui-table-page,.layui-table-box,.layui-table-main{background:transparent!important;border:none!important;}.layui-table thead tr,.layui-table-header{background:#121b34!important;}.layui-table thead th{color:#cfe0ff!important;font-weight:700;border-color:rgba(148,163,184,.12)!important;}.layui-table tbody td{color:#e5eefc!important;background:transparent!important;border-color:rgba(148,163,184,.12)!important;}.layui-table tbody tr,.layui-table-view .layui-table tr,.layui-table-body .layui-table tr,.layui-table-even,.layui-table-hover,.layui-table-click{background:transparent!important;}.layui-table-body .layui-table-hover>td,.layui-table-body .layui-table-click>td,.layui-table-body .layui-table-even>td{background:transparent!important;}.layui-table tbody tr:hover{background:rgba(255,255,255,.03)!important;}.layui-table tbody tr:hover>td{background:rgba(255,255,255,.03)!important;}.rank-badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 10px;border-radius:999px;font-weight:800;color:#0f172a;background:#dbeafe;}.rank-badge.top1{background:var(--bank-gold);}.rank-badge.top2{background:#dbe2f1;}.rank-badge.top3{background:#dfaa87;}@media (max-width:1100px){.bank-grid{grid-template-columns:1fr;}}
</style>
<div class="bank-ranking-page"><div class="bank-hero"><h1>学生银行排行榜</h1><p>按学生银行积分余额实时排序，快速查看高积分学员、班级分布与账户活跃度。</p></div><div class="bank-grid"><div class="bank-panel"><div class="panel-title">冠军席位</div><div class="champion" id="championCard"><div class="crown">👑</div><div class="name">暂无数据</div></div><div class="panel-title" style="margin-top:16px;">TOP 10</div><div class="mini-list" id="miniList"></div></div><div class="bank-table-card"><table class="layui-hide" id="rankingTable" lay-filter="rankingTable"></table></div></div></div>
<script>
layui.use(['table'],function(){var table=layui.table;function renderSide(rows){rows=rows||[];if(!rows.length){$('#championCard').html('<div class="crown">👑</div><div class="name">暂无数据</div>');$('#miniList').html('');return;}var top=rows[0];$('#championCard').html('<div class="crown">👑</div><div class="name">'+(top.student_name||'')+'</div><div class="class">'+(top.class_name||'')+'</div><div class="balance">'+top.balance+'</div>');var html='';$.each(rows.slice(0,10),function(_,item){html+='<div class="mini-item"><div><span class="mini-rank">'+item.rank_no+'</span>'+(item.student_name||'')+'</div><div>'+item.balance+'</div></div>';});$('#miniList').html(html);}table.render({elem:'#rankingTable',url:'/backend/edu/student_bank_ranking/index',parseData:function(res){renderSide(res.data||[]);return res;},cols:[[{field:'rank_no',title:'排名',width:90,templet:function(d){var cls=d.rank_no<=3?'top'+d.rank_no:'';return '<span class="rank-badge '+cls+'">'+d.rank_no+'</span>'; }},{field:'student_name',title:'学生',width:140},{field:'class_name',title:'班级',width:180},{field:'total_income',title:'累计收入',width:120},{field:'total_expense',title:'累计支出',width:120},{field:'balance',title:'余额',width:120,sort:true}]],page:false,text:{none:'暂无排行数据'}});});
</script>
