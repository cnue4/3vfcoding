{layout name="layout/main" /}
<style>
    #table + .layui-table-view .layui-table-tool-temp {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-right: 0;
    }

    #table + .layui-table-view .layui-table-tool-self {
        position: static;
        float: none;
        margin: 0;
        display: inline-flex;
        align-items: flex-end;
        align-self: flex-end;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline {
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container > * + * {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline + .layui-inline,
    #table + .layui-table-view .layui-table-tool-self .layui-btn + .layui-btn {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn {
        height: 30px;
        line-height: 30px;
        padding: 0 10px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn .layui-icon {
        margin-right: 4px;
    }

    .table-batch-delete-disabled {
        opacity: .45;
        cursor: not-allowed;
        pointer-events: none;
    }

    .table-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
    }

    .table-action-group .layui-btn {
        margin: 0;
    }
</style>
<div class="layui-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">课程管理</h3>
    </div>
    <div class="layui-card-body">
        <div class="layui-form layui-form-pane" lay-filter="course-search">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">搜索</label>
                    <div class="layui-input-inline">
                        <input type="text" name="keyword" placeholder="请输入课程名称、编号或分类" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="search">
                        <i class="layui-icon layui-icon-search"></i> 搜索
                    </button>
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset">
                        <i class="layui-icon layui-icon-refresh"></i> 重置
                    </button>
                </div>
            </div>
        </div>
        <table class="layui-hide" id="table" lay-filter="table"></table>
    </div>
</div>
<script type="text/html" id="toolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon layui-icon-add-circle"></i> 添加课程
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-danger table-batch-delete-disabled" lay-event="batchDelete" id="eduCourseBatchDeleteBtn">
            <i class="layui-icon layui-icon-delete"></i> 批量删除
        </button>
    </div>
</script>
<script type="text/html" id="status">
    {{# if(d.status == 1){ }}
    <span class="layui-badge layui-bg-green">正常</span>
    {{# } else { }}
    <span class="layui-badge layui-bg-red">停用</span>
    {{# } }}
</script>
<script type="text/html" id="action">
    <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</button>
    <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button>
</script>
<script>
    layui.use(['table', 'form', 'layer'], function() {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;

        function relocateDefaultToolbar() {
            var $tableView = $('#table').next('.layui-table-view');
            var $toolbar = $tableView.find('.layui-table-tool-self');
            var $anchor = $('#eduCourseBatchDeleteBtn');
            if (!$tableView.length || !$toolbar.length || !$anchor.length) {
                return;
            }
            $toolbar.insertAfter($anchor);
        }

        function reloadCourseTable(resetPage) {
            table.reload('table', {
                where: $.extend({}, form.val('course-search') || {}, {_t: new Date().getTime()}),
                page: resetPage ? {curr: 1} : undefined
            });
        }

        function updateBatchDeleteButtonState() {
            var selected = table.checkStatus('table').data || [];
            $('#eduCourseBatchDeleteBtn').toggleClass('table-batch-delete-disabled', !selected.length);
        }

        function deleteItems(ids, done, options) {
            options = options || {};
            $.post('/backend/edu/edu_course/delete', {ids: ids.join(',')}, function(res) {
                if (res.code === 1) {
                    layer.msg(options.successText || res.msg || '删除成功', {icon: 1}, function() {
                        reloadCourseTable(false);
                        updateBatchDeleteButtonState();
                        if (typeof done === 'function') done(true);
                    });
                } else {
                    layer.msg((res && res.msg) || '删除失败', {icon: 2});
                    if (typeof done === 'function') done(false);
                }
            }, 'json').fail(function() {
                layer.msg('删除失败，请稍后重试', {icon: 2});
                if (typeof done === 'function') done(false);
            });
        }

        table.render({
            elem: '#table',
            id: 'table',
            url: '/backend/edu/edu_course/index',
            where: {_t: new Date().getTime()},
            toolbar: '#toolbar',
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                {type: 'checkbox'},
                {field: 'id', title: 'ID', width: 80},
                {field: 'name', title: '课程名称', width: 180},
                {field: 'category_name', title: '课程分类', width: 140},
                {field: 'unit_price', title: '课时单价', width: 100},
                {field: 'total_hours', title: '总课时', width: 100},
                {field: 'course_type_text', title: '课程类型', width: 100},
                {field: 'difficulty_text', title: '难度等级', width: 100},
                {field: 'status', title: '状态', width: 80, templet: '#status'},
                {field: 'create_time', title: '创建时间', width: 180},
                {toolbar: '#action', title: '操作', width: 140, fixed: 'right'}
            ]],
            page: true,
            limit: 10,
            limits: [10, 20, 30, 50],
            text: {
                none: '暂无数据'
            },
            done: function() {
                updateBatchDeleteButtonState();
                relocateDefaultToolbar();
            }
        });

        table.on('toolbar(table)', function(obj) {
            var event = obj.event;
            if (event === 'add') {
                layer.open({
                    type: 2,
                    title: '添加课程',
                    content: '/backend/edu/edu_course/add',
                    area: ['820px', '620px'],
                    end: function() {
                        reloadCourseTable(false);
                    }
                });
            } else if (event === 'batchDelete') {
                var selected = table.checkStatus('table').data || [];
                if (!selected.length) {
                    updateBatchDeleteButtonState();
                    return;
                }
                var ids = selected.map(function(item) { return item.id; });
                layer.confirm('确定要批量删除选中的 ' + ids.length + ' 个课程吗？', function(index) {
                    deleteItems(ids, function() {
                        layer.close(index);
                    }, {successText: '已删除 ' + ids.length + ' 条数据'});
                });
            }
        });

        table.on('checkbox(table)', function() {
            updateBatchDeleteButtonState();
        });

        table.on('tool(table)', function(obj) {
            var event = obj.event;
            var data = obj.data;
            if (event === 'edit') {
                layer.open({
                    type: 2,
                    title: '编辑课程',
                    content: '/backend/edu/edu_course/edit?id=' + data.id,
                    area: ['820px', '620px'],
                    end: function() {
                        reloadCourseTable(false);
                    }
                });
            } else if (event === 'delete') {
                layer.confirm('确定要删除这个课程吗？', function(index) {
                    deleteItems([data.id], function() {
                        layer.close(index);
                    });
                });
            }
        });

        form.on('submit(search)', function(data) {
            table.reload('table', {
                where: $.extend({}, data.field, {_t: new Date().getTime()}),
                page: {curr: 1}
            });
            return false;
        });

        form.on('submit(reset)', function() {
            $('input[name="keyword"]').val('');
            reloadCourseTable(true);
            return false;
        });

        $(window).on('focus', function() {
            reloadCourseTable(false);
        });
    });
</script>
