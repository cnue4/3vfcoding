{layout name="layout/main" /}
<style>
    html, body {height: 100%;overflow: auto;background: #f5f7fb;}
    .bank-view-card {min-height: 100%;}
    .bank-view-card .layui-card-body {max-height: calc(100vh - 90px);overflow-y: auto;box-sizing: border-box;}
    @media (max-width: 640px) {
        .bank-view-card .layui-form-label {width: auto;float: none;display: block;margin-bottom: 8px;}
        .bank-view-card .layui-input-block {margin-left: 0;}
    }
</style>
<div class="layui-card bank-view-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">查看学生银行记录</h3>
    </div>
    <div class="layui-card-body">
        <form class="layui-form layui-form-pane">
            <div class="layui-form-item">
                <label class="layui-form-label">学生姓名</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.student_name|default=''}" class="layui-input" readonly>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">班级</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.class_name|default=''}" class="layui-input" readonly>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">积分收入</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.total_income|default='0'}" class="layui-input" readonly>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">积分支出</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.total_expense|default='0'}" class="layui-input" readonly>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">积分余额</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.balance|default='0'}" class="layui-input" readonly>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea class="layui-textarea" readonly>{$formData.remark|default=''}</textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">创建时间</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.create_time|default=''}" class="layui-input" readonly>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">修改时间</label>
                <div class="layui-input-block">
                    <input type="text" value="{$formData.update_time|default=''}" class="layui-input" readonly>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">
                        <i class="layui-icon layui-icon-close"></i> 关闭
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
