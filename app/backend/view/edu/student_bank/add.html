{layout name="layout/main" /}
<style>
    html, body {height: 100%;overflow: auto;background: #f5f7fb;}
    .bank-form-card {min-height: 100%;}
    .bank-form-card .layui-card-body {max-height: calc(100vh - 90px);overflow-y: auto;box-sizing: border-box;}
    .bank-summary {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px;}
    .bank-summary-item {padding:14px 16px;border-radius:12px;border:1px solid #e5ebf5;background:#fff;}
    .bank-summary-label {font-size:12px;color:#64748b;}
    .bank-summary-value {margin-top:8px;font-size:24px;font-weight:800;}
    .bank-summary-income .bank-summary-value {color:#16a34a;}
    .bank-summary-expense .bank-summary-value {color:#dc2626;}
    .bank-summary-balance .bank-summary-value {color:#2563eb;}
    @media (max-width: 640px) {
        .bank-form-card .layui-form-label {width: auto;float: none;display: block;margin-bottom: 8px;}
        .bank-form-card .layui-input-block {margin-left: 0;}
        .bank-summary {grid-template-columns:1fr;}
    }
</style>
<div class="layui-card bank-form-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">{if isset($formData['id'])}调整学生积分{else}添加学生积分账户{/if}</h3>
    </div>
    <div class="layui-card-body">
        {if isset($formData['student_id']) && $formData['student_id']}
        <div class="bank-summary">
            <div class="bank-summary-item bank-summary-income">
                <div class="bank-summary-label">当前积分收入</div>
                <div class="bank-summary-value">{$formData['total_income']|default='0'}</div>
            </div>
            <div class="bank-summary-item bank-summary-expense">
                <div class="bank-summary-label">当前积分支出</div>
                <div class="bank-summary-value">{$formData['total_expense']|default='0'}</div>
            </div>
            <div class="bank-summary-item bank-summary-balance">
                <div class="bank-summary-label">当前积分余额</div>
                <div class="bank-summary-value">{$formData['balance']|default='0'}</div>
            </div>
        </div>
        {/if}
        <form class="layui-form layui-form-pane" id="form"
              action="{if isset($formData['id']) && $formData['id']}/backend/edu/student_bank/edit?id={$formData['id']|default=''}{else}/backend/edu/student_bank/add{/if}"
              method="post">
            <input type="hidden" name="id" value="{$formData['id']|default=''}">
            <input type="hidden" name="student_id" id="student_id" value="{$formData['student_id']|default=''}">

            <div class="layui-form-item">
                <label class="layui-form-label">搜索学生 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="student_keyword" id="student_keyword" value="{$formData['student_name']|default=''}" class="layui-input" placeholder="请输入学生姓名或学号后点击搜索" autocomplete="off" {if !empty($formData['lock_student'])}readonly{/if}>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn layui-btn-primary" id="searchStudentBtn" {if !empty($formData['lock_student'])}style="display:none;"{/if}><i class="layui-icon layui-icon-search"></i> 搜索学生</button>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">学生姓名</label>
                <div class="layui-input-block">
                    <input type="text" id="student_name_display" value="{$formData['student_name']|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">班级</label>
                <div class="layui-input-block">
                    <input type="text" id="class_name_display" value="{$formData['class_name']|default=''}" class="layui-input" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">调整类型 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="radio" name="mode" value="income" title="增加积分" {if !isset($formData['mode']) || $formData['mode']=='income'}checked{/if}>
                    <input type="radio" name="mode" value="expense" title="扣除积分" {if isset($formData['mode']) && $formData['mode']=='expense'}checked{/if}>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">调整数量 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="number" name="amount" value="{$formData['amount']|default=''}" class="layui-input" placeholder="请输入本次调整积分数量" min="0.01" step="0.01" required lay-verify="required">
                </div>
            </div>

            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" placeholder="请输入本次调整备注">{$formData['remark']|default=''}</textarea>
                </div>
            </div>

            <div class="layui-form-item" style="display:none;">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="正常" {if !isset($formData['status']) || (int)$formData['status']==1}checked{/if}>
                    <input type="radio" name="status" value="2" title="禁用" {if isset($formData['status']) && (int)$formData['status']==2}checked{/if}>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn layui-btn-normal" lay-submit lay-filter="submit">
                        <i class="layui-icon layui-icon-save"></i> 保存
                    </button>
                    <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">
                        <i class="layui-icon layui-icon-close"></i> 取消
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
layui.use(['form', 'layer', 'jquery'], function() {
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.jquery;
    form.render();

    function setStudent(student) {
        $('#student_id').val(student.id || '');
        $('#student_name_display').val(student.name || '');
        $('#class_name_display').val(student.class_name || '');
        $('#student_keyword').val(student.name || '');
    }

    function normalizeKeyword(value){
        return $.trim(value || '').toLowerCase();
    }

    function rankStudents(list, keyword){
        var normalizedKeyword = normalizeKeyword(keyword);
        return $.map(list || [], function(item){
            var name = normalizeKeyword(item.name || '');
            var studentNo = normalizeKeyword(item.student_no || '');
            var rank = 999;
            if(name === normalizedKeyword){ rank = 1; }
            else if(studentNo === normalizedKeyword){ rank = 2; }
            else if(name.indexOf(normalizedKeyword) === 0){ rank = 3; }
            else if(studentNo.indexOf(normalizedKeyword) === 0){ rank = 4; }
            else if(name.indexOf(normalizedKeyword) !== -1){ rank = 5; }
            else if(studentNo.indexOf(normalizedKeyword) !== -1){ rank = 6; }
            else { return null; }
            item.__rank = rank;
            return item;
        }).sort(function(a, b){
            if(a.__rank !== b.__rank){ return a.__rank - b.__rank; }
            return Number(a.id || 0) - Number(b.id || 0);
        });
    }

    function refreshParentAndClose(resetPage) {
        if (parent && typeof parent.__refreshStudentBankTable === 'function') {
            parent.__refreshStudentBankTable(!!resetPage);
        }
        if (parent && parent.layer) {
            var frameIndex = parent.layer.getFrameIndex(window.name);
            parent.layer.close(frameIndex);
        }
    }

    function searchStudent() {
        var keyword = $.trim($('#student_keyword').val());
        if (!keyword) {
            layer.msg('请输入学生姓名或学号', {icon: 2});
            return;
        }
        $.ajax({
            url:'/backend/edu/student/index',
            type:'GET',
            data:{keyword:keyword, page:1, limit:50},
            dataType:'json',
            success:function(res){
                var matchedList = rankStudents(res && res.data ? res.data : [], keyword);
                if(!matchedList.length){
                    layer.msg('没有找到该学生', {icon:2});
                    return;
                }
                if(matchedList[0].__rank <= 2){
                    setStudent(matchedList[0]);
                    layer.msg('已自动精确匹配学生', {icon:1});
                    return;
                }
                if(matchedList.length === 1){
                    setStudent(matchedList[0]);
                    layer.msg('已自动选中学生', {icon:1});
                    return;
                }
                var displayList = matchedList.slice(0, 10);
                var html = '<div style="padding:12px;">';
                $.each(displayList, function(_, item) {
                    html += '<div class="choose-student-item" data-id="' + item.id + '" data-name="' + (item.name || '') + '" data-class="' + (item.class_name || '') + '" style="padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;cursor:pointer;">'
                        + '<div style="font-weight:700;color:#111827;">' + (item.name || '') + '</div>'
                        + '<div style="font-size:12px;color:#6b7280;margin-top:4px;">学号：' + (item.student_no || '') + '　班级：' + (item.class_name || '') + '</div>'
                        + '</div>';
                });
                html += '</div>';
                layer.open({
                    type: 1,
                    title: '请选择学生',
                    area: ['520px', '420px'],
                    content: html,
                    success: function(layero, index) {
                        $(layero).find('.choose-student-item').on('click', function() {
                            setStudent({
                                id: $(this).data('id'),
                                name: $(this).data('name'),
                                class_name: $(this).data('class')
                            });
                            layer.close(index);
                        });
                    }
                });
            },
            error:function(){
                layer.msg('搜索失败，请稍后重试', {icon:2});
            }
        });
    }

    $('#searchStudentBtn').on('click', function() {
        searchStudent();
    });

    $('#student_keyword').on('keydown', function(e) {
        if ((e.key && e.key === 'Enter') || e.keyCode === 13) {
            e.preventDefault();
            searchStudent();
        }
    });

    form.on('submit(submit)', function(data) {
        if (!$.trim(data.field.student_id || '')) {
            layer.msg('请先搜索并选择学生', {icon: 2});
            return false;
        }
        $.post($('#form').attr('action'), data.field, function(res) {
            if (res.code === 1) {
                layer.msg(res.msg, {icon: 1}, function() {
                    refreshParentAndClose(false);
                });
            } else {
                layer.msg(res.msg, {icon: 2});
            }
        }, 'json');
        return false;
    });
});
</script>
