{layout name="layout/main" /}
<style>
    html, body {height:100%;overflow:auto;background:#f5f7fb;}
    .attendance-view-card {min-height:100%;}
    .attendance-view-card .layui-card-body {max-height:calc(100vh - 90px);overflow-y:auto;box-sizing:border-box;}
    @media (max-width:640px) {
        .attendance-view-card .layui-form-label {width:auto;float:none;display:block;margin-bottom:8px;}
        .attendance-view-card .layui-input-block {margin-left:0;}
    }
</style>
<div class="layui-card attendance-view-card">
    <div class="layui-card-header"><h3 class="layui-card-title">查看考勤记录</h3></div>
    <div class="layui-card-body">
        <form class="layui-form layui-form-pane">
            <div class="layui-form-item"><label class="layui-form-label">考勤单号</label><div class="layui-input-block"><input type="text" value="{$formData.attendance_no|default=''}" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">考勤日期</label><div class="layui-input-block"><input type="text" value="{$formData.attendance_date|default=''}" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">班级</label><div class="layui-input-block"><input type="text" value="{$formData.class_name|default=''}" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">学生</label><div class="layui-input-block"><input type="text" value="{$formData.student_name|default=''}" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">教师</label><div class="layui-input-block"><input type="text" value="{$formData.teacher_name|default=''}" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">考勤状态</label><div class="layui-input-block"><input type="text" value="{$formData.attendance_status_text|default=''}" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">迟到分钟</label><div class="layui-input-block"><input type="text" value="{$formData.minutes_late|default='0'}" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">早退分钟</label><div class="layui-input-block"><input type="text" value="{$formData.minutes_leave_early|default='0'}" class="layui-input" readonly></div></div>
            <div class="layui-form-item"><label class="layui-form-label">扣减课时</label><div class="layui-input-block"><input type="text" value="{$formData.deduct_hours|default='0'}" class="layui-input" readonly></div></div>
            <div class="layui-form-item layui-form-text"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea class="layui-textarea" readonly>{$formData.remark|default=''}</textarea></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()"><i class="layui-icon layui-icon-close"></i> 关闭</button></div></div>
        </form>
    </div>
</div>
