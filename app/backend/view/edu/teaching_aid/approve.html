{layout name="layout/main" /}
<div class="layui-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">审批教具申请</h3>
    </div>

    <div class="layui-card-body">
        <form class="layui-form layui-form-pane" id="form"
              action="/backend/edu/teaching_aid/approve?id={$formData['id']|default=''}" method="post">
            {:token_field()}
            <input type="hidden" name="id" value="{$formData['id']|default=''}">

            <div class="layui-form-item">
                <label class="layui-form-label">申请编号</label>
                <div class="layui-input-block">
                    <input type="text" class="layui-input" value="{$formData['apply_no']|default=''}" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">教具名称</label>
                <div class="layui-input-block">
                    <input type="text" class="layui-input" value="{$formData['item_name']|default=''}" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">数量</label>
                <div class="layui-input-block">
                    <input type="number" class="layui-input" value="{$formData['quantity']|default=0}" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">用途说明</label>
                <div class="layui-input-block">
                    <textarea class="layui-textarea" readonly>{$formData['purpose']|default=''}</textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">需求日期</label>
                <div class="layui-input-block">
                    <input type="text" class="layui-input" value="{$formData['need_time']|default=''}" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">申请教师</label>
                <div class="layui-input-block">
                    <input type="text" class="layui-input"
                           value="{if isset($teacher['nickname']) && $teacher['nickname']}{$teacher['nickname']}{else}{$formData['teacher_id']|default=''}{/if}" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">审批结果 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="通过" checked lay-verify="required">
                    <input type="radio" name="status" value="2" title="拒绝">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">审批备注</label>
                <div class="layui-input-block">
                    <textarea name="approve_remark" class="layui-textarea" placeholder="可选填写">{$formData['approve_remark']|default=''}</textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn layui-btn-normal" lay-submit lay-filter="submit">
                        <i class="layui-icon layui-icon-ok-circle"></i> 提交审批
                    </button>
                    <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">
                        <i class="layui-icon layui-icon-close"></i> 取消
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    layui.use(['form', 'layer'], function() {
        var form = layui.form;
        var layer = layui.layer;
        form.render();

        function refreshParentAndClose(resetPage) {
            if (parent && typeof parent.__refreshTeachingAidTable === 'function') {
                parent.__refreshTeachingAidTable(!!resetPage);
            }
            if (parent && parent.layer) {
                var frameIndex = parent.layer.getFrameIndex(window.name);
                parent.layer.close(frameIndex);
            }
        }

        form.on('submit(submit)', function(data) {
            var postUrl = $('#form').attr('action');
            $.post(postUrl, data.field, function(res) {
                if (res.code === 1) {
                    layer.msg(res.msg, {icon: 1}, function() {
                        refreshParentAndClose(false);
                    });
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            }, 'json');
            return false;
        });

        $(window).on('beforeunload', function() {
            if (parent && typeof parent.__refreshTeachingAidTable === 'function') {
                parent.__refreshTeachingAidTable(false);
            }
        });
    });
</script>
