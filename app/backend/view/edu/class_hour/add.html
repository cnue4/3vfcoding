{layout name="layout/main" /}
<style>html,body{height:100%;overflow:auto;background:#f5f7fb}.class-hour-form-card{min-height:100%}.class-hour-form-card .layui-card-body{max-height:calc(100vh - 90px);overflow-y:auto;box-sizing:border-box}</style>
<div class="layui-card class-hour-form-card"><div class="layui-card-header"><h3 class="layui-card-title">{$title}课时记录</h3></div><div class="layui-card-body"><form class="layui-form layui-form-pane" id="form" action="{if isset($formData['id'])}/backend/edu/class_hour/edit?id={$formData['id']}{else}/backend/edu/class_hour/add{/if}" method="post"><div class="layui-form-item"><label class="layui-form-label">课时记录编号</label><div class="layui-input-block"><input type="text" value="{if isset($formData['record_no'])}{$formData['record_no']}{else}保存后自动生成{/if}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">班级</label><div class="layui-input-block"><select name="class_id">{foreach $classList as $classId => $className}<option value="{$classId}" {if isset($formData['class_id']) && (int)$formData['class_id']===(int)$classId}selected{/if}>{$classId} - {$className}</option>{/foreach}</select></div></div><div class="layui-form-item"><label class="layui-form-label">上课老师</label><div class="layui-input-block"><select name="teacher_id">{volist name="teacherList" id="teacher"}<option value="{$teacher.id}" {if isset($formData['teacher_id']) && (int)$formData['teacher_id']===(int)$teacher['id']}selected{/if}>{$teacher.realname|default=''}{if $teacher.realname && $teacher.username}（{$teacher.username}）{else /}{$teacher.username|default=''}{/if}</option>{/volist}</select></div></div><div class="layui-form-item"><label class="layui-form-label">上课日期</label><div class="layui-input-block"><input type="date" name="class_date" value="{$formData['class_date']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">开始时间</label><div class="layui-input-block"><input type="time" name="start_time" value="{$formData['start_time']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">结束时间</label><div class="layui-input-block"><input type="time" name="end_time" value="{$formData['end_time']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">实际课时</label><div class="layui-input-block"><input type="number" name="actual_hours" value="{$formData['actual_hours']|default='1'}" class="layui-input" step="any" min="0"></div></div><div class="layui-form-item"><label class="layui-form-label">扣课模式</label><div class="layui-input-block">{foreach $attendanceModeList as $modeValue => $modeName}<input type="radio" name="attendance_mode" value="{$modeValue}" title="{$modeName}" {if !isset($formData['attendance_mode']) && (int)$modeValue===1}checked{elseif isset($formData['attendance_mode']) && (int)$formData['attendance_mode']===(int)$modeValue}checked{/if}>{/foreach}</div></div><div class="layui-form-item"><label class="layui-form-label">请假学生姓名</label><div class="layui-input-block"><input type="text" name="leave_student_ids" value="{$formData['leave_student_names']|default=''}" class="layui-input" placeholder="跳过请假学生时填写，如 张三,李四,赵二"></div></div><div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><input type="radio" name="status" value="1" title="正常" {if !isset($formData['status']) || (int)$formData['status']===1}checked{/if}><input type="radio" name="status" value="0" title="取消" {if isset($formData['status']) && (int)$formData['status']===0}checked{/if}></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="submit">保存</button><button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">取消</button></div></div></form></div></div>
<script>layui.use(['form','layer'],function(){var form=layui.form,layer=layui.layer;form.on('submit(submit)',function(data){$.post($('#form').attr('action'),data.field,function(res){if(res.code===1){layer.msg(res.msg,{icon:1},function(){parent.layer.closeAll();});}else{layer.msg(res.msg,{icon:2});}},'json');return false;});});</script>
