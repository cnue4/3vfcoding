{layout name="layout/main" /}
<style>
    #table + .layui-table-view .layui-table-tool-temp {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-right: 0;
    }

    #table + .layui-table-view .layui-table-tool-self {
        position: static;
        float: none;
        margin: 0;
        display: inline-flex;
        align-items: flex-end;
        align-self: flex-end;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline {
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container > * + * {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline + .layui-inline,
    #table + .layui-table-view .layui-table-tool-self .layui-btn + .layui-btn {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn {
        height: 30px;
        line-height: 30px;
        padding: 0 10px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn .layui-icon {
        margin-right: 4px;
    }

    .table-batch-delete-disabled {
        opacity: .45;
        cursor: not-allowed;
        pointer-events: none;
    }

    .table-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
    }

    .table-action-group .layui-btn {
        margin: 0;
    }
</style>
<div class="layui-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">学生异动</h3>
    </div>
    <div class="layui-card-body">
        <div class="layui-form layui-form-pane" lay-filter="search">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">搜索学生</label>
                    <div class="layui-input-inline" style="width:260px;">
                        <input type="text" name="keyword" placeholder="请输入学生姓名、学号、备注或原因" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset"><i class="layui-icon layui-icon-refresh"></i> 重置</button>
                </div>
            </div>
        </div>
        <table class="layui-hide" id="table" lay-filter="table"></table>
    </div>
</div>
<script type="text/html" id="toolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add"><i class="layui-icon layui-icon-add-circle"></i> 添加异动</button>
        <button class="layui-btn layui-btn-sm layui-btn-danger table-batch-delete-disabled" lay-event="batchDelete" id="studentChangeBatchDeleteBtn"><i class="layui-icon layui-icon-delete"></i> 批量删除</button>
    </div>
</script>
<script type="text/html" id="change_type">
    {{# if(d.change_type == 1){ }}<span class="layui-badge layui-bg-orange">请假</span>{{# } }}
    {{# if(d.change_type == 2){ }}<span class="layui-badge layui-bg-blue">调课</span>{{# } }}
    {{# if(d.change_type == 3){ }}<span class="layui-badge layui-bg-red">退费</span>{{# } }}
    {{# if(d.change_type == 4){ }}<span class="layui-badge layui-bg-green">赠课</span>{{# } }}
    {{# if(d.change_type == 5){ }}<span class="layui-badge">删除赠课</span>{{# } }}
</script>
<script type="text/html" id="action">
    <button class="layui-btn layui-btn-xs" lay-event="view">查看</button>
    <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</button>
    <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button>
</script>
<script>
layui.use(['table','form','layer'], function(){
    var table = layui.table, form = layui.form, layer = layui.layer;
    var tableId = 'StudentChangeTable';

    function relocateDefaultToolbar(){
        var $tableView = $('#table').next('.layui-table-view');
        var $toolbar = $tableView.find('.layui-table-tool-self');
        var $anchor = $('#studentChangeBatchDeleteBtn');
        if(!$tableView.length || !$toolbar.length || !$anchor.length){
            return;
        }
        $toolbar.insertAfter($anchor);
    }

    function reloadTable(resetPage){
        table.reload(tableId, resetPage ? {page:{curr:1}} : {});
    }

    function openForm(title, url){
        layer.open({type:2,title:title,content:url,area:['900px','700px'],maxmin:true,shadeClose:false,end:function(){reloadTable(false);}});
    }

    function updateBatchDeleteButtonState(){
        var selected = table.checkStatus(tableId).data || [];
        $('#studentChangeBatchDeleteBtn').toggleClass('table-batch-delete-disabled', !selected.length);
    }

    function deleteItems(ids, done, options){
        options = options || {};
        $.post('/backend/edu/student_change/delete', {ids:ids.join(',')}, function(res){
            if(res.code === 1){
                layer.msg(options.successText || res.msg || '删除成功',{icon:1},function(){reloadTable(false); updateBatchDeleteButtonState(); if(typeof done === 'function') done(true);});
            } else {
                layer.msg((res && res.msg) || '删除失败',{icon:2});
                if(typeof done === 'function') done(false);
            }
        }, 'json').fail(function(){
            layer.msg('删除失败，请稍后重试',{icon:2});
            if(typeof done === 'function') done(false);
        });
    }

    table.render({
        elem:'#table',
        id:tableId,
        url:'/backend/edu/student_change/index',
        toolbar:'#toolbar',
        defaultToolbar:['filter','exports','print'],
        cols:[[
            {type:'checkbox'},
            {field:'id', title:'ID', width:70},
            {field:'student_name', title:'姓名', width:110},
            {field:'class_name', title:'班级', width:150},
            {field:'change_type', title:'异动类型', width:100, templet:'#change_type'},
            {field:'leave_start_time', title:'请假开始', width:120},
            {field:'leave_end_time', title:'请假结束', width:120},
            {field:'old_course_name', title:'旧课程', width:130},
            {field:'new_course_name', title:'新课程', width:130},
            {field:'refund_amount', title:'退费金额(元)', width:110},
            {field:'gift_hours', title:'赠课数量', width:100},
            {field:'remark', title:'备注', minWidth:200},
            {field:'create_time', title:'创建时间', width:170},
            {field:'update_time', title:'修改时间', width:170},
            {toolbar:'#action', title:'操作', width:180, fixed:'right'}
        ]],
        page:true,
        limit:10,
        limits:[10,20,30,50],
        text:{none:'暂无数据'},
        done:function(){ updateBatchDeleteButtonState(); relocateDefaultToolbar(); }
    });

    table.on('toolbar(table)', function(obj){
        if(obj.event === 'add') {
            openForm('添加学生异动', '/backend/edu/student_change/add');
        } else if(obj.event === 'batchDelete') {
            var selected = table.checkStatus(tableId).data || [];
            if(!selected.length){
                updateBatchDeleteButtonState();
                return;
            }
            var ids = selected.map(function(item){ return item.id; });
            layer.confirm('确定要批量删除选中的 ' + ids.length + ' 条学生异动记录吗？', function(index){
                deleteItems(ids, function(){ layer.close(index); }, {successText:'已删除 ' + ids.length + ' 条数据'});
            });
        }
    });

    table.on('checkbox(table)', function(){
        updateBatchDeleteButtonState();
    });

    table.on('tool(table)', function(obj){
        var data = obj.data;
        if(obj.event === 'view') openForm('查看学生异动', '/backend/edu/student_change/view?id=' + data.id);
        if(obj.event === 'edit') openForm('编辑学生异动', '/backend/edu/student_change/edit?id=' + data.id);
        if(obj.event === 'delete') {
            layer.confirm('确定要删除这条学生异动记录吗？', function(index){
                deleteItems([data.id], function(){ layer.close(index); });
            });
        }
    });

    form.on('submit(search)', function(data){
        table.reload(tableId, {where:data.field, page:{curr:1}});
        return false;
    });

    form.on('submit(reset)', function(){
        form.val('search', {keyword:''});
        table.reload(tableId, {where:{}, page:{curr:1}});
        return false;
    });

    window.__refreshStudentChangeTable = function(resetPage){ reloadTable(!!resetPage); };
});
</script>
