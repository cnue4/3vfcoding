{layout name="layout/main" /}
<style>
    #table + .layui-table-view .layui-table-tool-temp {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-right: 0;
    }

    #table + .layui-table-view .layui-table-tool-self {
        position: static;
        float: none;
        margin: 0;
        display: inline-flex;
        align-items: flex-end;
        align-self: flex-end;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline {
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container > * + * {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline + .layui-inline,
    #table + .layui-table-view .layui-table-tool-self .layui-btn + .layui-btn {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn {
        height: 30px;
        line-height: 30px;
        padding: 0 10px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn .layui-icon {
        margin-right: 4px;
    }

    .table-batch-delete-disabled {
        opacity: .45;
        cursor: not-allowed;
        pointer-events: none;
    }

    .table-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
    }

    .table-action-group .layui-btn {
        margin: 0;
    }
</style>
<div class="layui-card"><div class="layui-card-header"><h3 class="layui-card-title">试听体验课</h3></div><div class="layui-card-body"><div class="layui-form layui-form-pane" lay-filter="search"><div class="layui-form-item"><div class="layui-inline"><label class="layui-form-label">搜索</label><div class="layui-input-inline" style="width:280px;"><input type="text" name="keyword" placeholder="请输入学员、单号、联系人或电话" class="layui-input"></div></div><div class="layui-inline"><button class="layui-btn layui-btn-primary" lay-submit lay-filter="search"><i class="layui-icon layui-icon-search"></i> 搜索</button><button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset"><i class="layui-icon layui-icon-refresh"></i> 重置</button></div></div></div><table class="layui-hide" id="table" lay-filter="table"></table></div></div>
<script type="text/html" id="toolbar"><div class="layui-btn-container"><button class="layui-btn layui-btn-sm" lay-event="add"><i class="layui-icon layui-icon-add-circle"></i> 添加试听</button><button class="layui-btn layui-btn-sm layui-btn-danger table-batch-delete-disabled" lay-event="batchDelete" id="trialBatchDeleteBtn"><i class="layui-icon layui-icon-delete"></i> 批量删除</button></div></script>
<script type="text/html" id="action"><button class="layui-btn layui-btn-xs" lay-event="view">查看</button><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button></script>
<script>
layui.use(['table','form','layer'],function(){
var table=layui.table,form=layui.form,layer=layui.layer,tableId='EduTrialClassTable';
function relocateDefaultToolbar(){var $tableView=$('#table').next('.layui-table-view');var $toolbar=$tableView.find('.layui-table-tool-self');var $anchor=$('#trialBatchDeleteBtn');if(!$tableView.length||!$toolbar.length||!$anchor.length){return;}$toolbar.insertAfter($anchor);} 
function reload(reset,where){var options={};if(reset){options.page={curr:1};}if(where){options.where=where;}table.reload(tableId,options);} 
function openForm(title,url){layer.open({type:2,title:title,content:url,area:['980px','760px'],maxmin:true,end:function(){reload(false);}});} 
function updateBatchDeleteButtonState(){var selected=table.checkStatus(tableId).data||[];$('#trialBatchDeleteBtn').toggleClass('table-batch-delete-disabled',!selected.length);} 
function deleteItems(ids,done,options){options=options||{};$.post('/backend/edu/edu_trial_class/delete',{ids:ids.join(',')},function(res){if(res.code===1){layer.msg(options.successText||res.msg||'删除成功',{icon:1},function(){reload(false);updateBatchDeleteButtonState();if(typeof done==='function')done(true);});}else{layer.msg((res&&res.msg)||'删除失败',{icon:2});if(typeof done==='function')done(false);}},'json').fail(function(){layer.msg('删除失败，请稍后重试',{icon:2});if(typeof done==='function')done(false);});}
table.render({elem:'#table',id:tableId,url:'/backend/edu/edu_trial_class/index',toolbar:'#toolbar',defaultToolbar:['filter','exports','print'],cols:[[{type:'checkbox'},{field:'trial_no',title:'试听单号',width:150},{field:'student_name',title:'学员',width:100},{field:'contact_name',title:'联系人',width:100},{field:'phone',title:'电话',width:120},{field:'intended_course_name',title:'意向课程',width:120},{field:'trial_class_name',title:'试听班级',width:120},{field:'teacher_name',title:'试听老师',width:100},{field:'trial_date',title:'试听日期',width:110},{field:'trial_time',title:'时段',width:100},{field:'trial_result_text',title:'试听结果',width:100},{field:'convert_status_text',title:'转化状态',width:100},{toolbar:'#action',title:'操作',width:180,fixed:'right'}]],page:true,limit:10,limits:[10,20,30,50],text:{none:'暂无数据'},done:function(){updateBatchDeleteButtonState();relocateDefaultToolbar();}});
table.on('toolbar(table)',function(obj){if(obj.event==='add'){openForm('添加试听','/backend/edu/edu_trial_class/add');}else if(obj.event==='batchDelete'){var selected=table.checkStatus(tableId).data||[];if(!selected.length){updateBatchDeleteButtonState();return;}var ids=selected.map(function(item){return item.id;});layer.confirm('确定要批量删除选中的 '+ids.length+' 条试听记录吗？',function(index){deleteItems(ids,function(){layer.close(index);},{successText:'已删除 '+ids.length+' 条数据'});});}});
table.on('checkbox(table)',function(){updateBatchDeleteButtonState();});
table.on('tool(table)',function(obj){var d=obj.data;if(obj.event==='view')openForm('查看试听','/backend/edu/edu_trial_class/view?id='+d.id);if(obj.event==='edit')openForm('编辑试听','/backend/edu/edu_trial_class/edit?id='+d.id);if(obj.event==='delete'){layer.confirm('确定删除吗？',function(i){deleteItems([d.id],function(){layer.close(i);});});}});
form.on('submit(search)',function(data){table.reload(tableId,{where:data.field,page:{curr:1}});return false;});
form.on('submit(reset)',function(){form.val('search',{keyword:''});table.reload(tableId,{where:{},page:{curr:1}});return false;});
});
</script>
