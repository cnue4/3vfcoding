{layout name="layout/main" /}
<div class="layui-card"><div class="layui-card-header"><h3 class="layui-card-title">查看试听体验课</h3></div><div class="layui-card-body"><form class="layui-form layui-form-pane"><div class="layui-form-item"><label class="layui-form-label">试听单号</label><div class="layui-input-block"><input type="text" value="{$formData.trial_no|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">试听学员</label><div class="layui-input-block"><input type="text" value="{$formData.student_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">联系人</label><div class="layui-input-block"><input type="text" value="{$formData.contact_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-block"><input type="text" value="{$formData.phone|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">年龄</label><div class="layui-input-block"><input type="text" value="{$formData.age|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">意向课程</label><div class="layui-input-block"><input type="text" value="{$formData.intended_course_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">试听班级</label><div class="layui-input-block"><input type="text" value="{$formData.trial_class_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">试听老师</label><div class="layui-input-block"><input type="text" value="{$formData.teacher_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">试听日期</label><div class="layui-input-block"><input type="text" value="{$formData.trial_date|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">试听时段</label><div class="layui-input-block"><input type="text" value="{$formData.trial_time|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">试听结果</label><div class="layui-input-block"><input type="text" value="{$formData.trial_result_text|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">转化状态</label><div class="layui-input-block"><input type="text" value="{$formData.convert_status_text|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item layui-form-text"><label class="layui-form-label">跟进记录</label><div class="layui-input-block"><textarea class="layui-textarea" readonly>{$formData.follow_record|default=''}</textarea></div></div><div class="layui-form-item layui-form-text"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea class="layui-textarea" readonly>{$formData.remark|default=''}</textarea></div></div><div class="layui-form-item"><div class="layui-input-block"><button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">关闭</button></div></div></form></div></div>
