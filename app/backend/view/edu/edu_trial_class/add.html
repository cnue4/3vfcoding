{layout name="layout/main" /}
<div class="layui-card"><div class="layui-card-header"><h3 class="layui-card-title">{$title}试听体验课</h3></div><div class="layui-card-body"><form class="layui-form layui-form-pane" id="form" action="{if isset($formData['id'])}/backend/edu/edu_trial_class/edit?id={$formData['id']}{else}/backend/edu/edu_trial_class/add{/if}" method="post"><div class="layui-form-item"><label class="layui-form-label">试听学员</label><div class="layui-input-block"><input type="text" name="student_name" value="{$formData['student_name']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">联系人</label><div class="layui-input-block"><input type="text" name="contact_name" value="{$formData['contact_name']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-block"><input type="text" name="phone" value="{$formData['phone']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">年龄</label><div class="layui-input-block"><input type="text" name="age" value="{$formData['age']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">意向课程</label><div class="layui-input-block"><select name="intended_course_id">{volist name="courseList" id="course"}<option value="{$course.id}" {if isset($formData['intended_course_id']) && (int)$formData['intended_course_id']==(int)$course['id']}selected{/if}>{$course.name}</option>{/volist}</select></div></div><div class="layui-form-item"><label class="layui-form-label">试听班级</label><div class="layui-input-block"><select name="trial_class_id">{volist name="classList" id="class"}<option value="{$class.id}" {if isset($formData['trial_class_id']) && (int)$formData['trial_class_id']==(int)$class['id']}selected{/if}>{$class.name}</option>{/volist}</select></div></div><div class="layui-form-item"><label class="layui-form-label">试听老师</label><div class="layui-input-block"><select name="teacher_id">{volist name="teacherList" id="teacher"}<option value="{$teacher.id}" {if isset($formData['teacher_id']) && (int)$formData['teacher_id']==(int)$teacher['id']}selected{/if}>{$teacher.realname|default=''}{if $teacher.realname && $teacher.username}（{$teacher.username}）{else /}{$teacher.username|default=''}{/if}</option>{/volist}</select></div></div><div class="layui-form-item"><label class="layui-form-label">试听日期</label><div class="layui-input-block"><input type="date" name="trial_date" value="{$formData['trial_date']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">试听时段</label><div class="layui-input-block"><input type="time" name="trial_time" value="{$formData['trial_time']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">试听结果</label><div class="layui-input-block"><select name="trial_result">{volist name="trialResultList" id="item"}<option value="{$item.value}" {if isset($formData['trial_result']) && (int)$formData['trial_result']==(int)$item['value']}selected{/if}>{$item.name}</option>{/volist}</select></div></div><div class="layui-form-item"><label class="layui-form-label">转化状态</label><div class="layui-input-block"><select name="convert_status">{volist name="convertStatusList" id="item"}<option value="{$item.value}" {if isset($formData['convert_status']) && (int)$formData['convert_status']==(int)$item['value']}selected{/if}>{$item.name}</option>{/volist}</select></div></div><div class="layui-form-item layui-form-text"><label class="layui-form-label">跟进记录</label><div class="layui-input-block"><textarea name="follow_record" class="layui-textarea">{$formData['follow_record']|default=''}</textarea></div></div><div class="layui-form-item layui-form-text"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="remark" class="layui-textarea">{$formData['remark']|default=''}</textarea></div></div><div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status">{volist name="statusList" id="item" key="key"}<option value="{$key}" {if isset($formData['status']) && (int)$formData['status']==(int)$key}selected{/if}>{$item}</option>{/volist}</select></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="submit">保存</button><button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">取消</button></div></div></form></div></div>
<script>layui.use(['form','layer'],function(){var form=layui.form,layer=layui.layer;form.on('submit(submit)',function(data){$.post($('#form').attr('action'),data.field,function(res){if(res.code===1){layer.msg(res.msg,{icon:1},function(){parent.layer.closeAll();});}else{layer.msg(res.msg,{icon:2});}},'json');return false;});});</script>
