{layout name="layout/main" /}
<style>
html,body{height:100%;overflow:auto;background:#f5f7fb}
.enroll-form-card{min-height:100%}
.enroll-form-card .layui-card-body{max-height:calc(100vh - 90px);overflow-y:auto;box-sizing:border-box}
.search-result-item{padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;cursor:pointer}
.search-result-item:hover{border-color:#2563eb;background:#eff6ff}
</style>
<div class="layui-card enroll-form-card"><div class="layui-card-header"><h3 class="layui-card-title">{$title}续费报名</h3></div><div class="layui-card-body"><form class="layui-form layui-form-pane" id="form" action="{if isset($formData['id'])}/backend/edu/edu_enrollment/edit?id={$formData['id']}{else}/backend/edu/edu_enrollment/add{/if}" method="post"><input type="hidden" name="student_id" id="student_id" value="{$formData['student_id']|default=''}"><input type="hidden" name="source_class_id" id="source_class_id" value="{$formData['source_class_id']|default=''}"><div class="layui-form-item"><label class="layui-form-label">搜索学生</label><div class="layui-input-block"><input type="text" name="student_keyword" id="student_keyword" value="{$formData['student_name']|default=''}" class="layui-input" placeholder="请输入学生姓名、学号、联系人或电话" autocomplete="off"></div></div><div class="layui-form-item"><div class="layui-input-block"><button type="button" class="layui-btn layui-btn-primary" id="searchStudentBtn">搜索学生</button></div></div><div class="layui-form-item"><label class="layui-form-label">学生姓名</label><div class="layui-input-block"><input type="text" id="student_name_display" value="{$formData['student_name']|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">联系人</label><div class="layui-input-block"><input type="text" name="contact_name" id="contact_name" value="{$formData['contact_name']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-block"><input type="text" name="phone" id="phone" value="{$formData['phone']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">报名类型</label><div class="layui-input-block">{volist name="enrollTypeList" id="typeName" key="typeValue"}<input type="radio" name="enroll_type" value="{$typeValue}" title="{$typeName}" {if !isset($formData['enroll_type']) && $typeValue==1}checked{elseif isset($formData['enroll_type']) && (int)$formData['enroll_type']==(int)$typeValue}checked{/if}>{/volist}</div></div><div class="layui-form-item"><label class="layui-form-label">原班级</label><div class="layui-input-block"><input type="text" id="source_class_name" value="{$formData['source_class_name']|default=''}" class="layui-input" placeholder="选择学生后自动读取" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">目标班级</label><div class="layui-input-block"><select name="target_class_id" id="target_class_id"><option value="">请选择班级</option>{volist name="classList" id="class"}<option value="{$class.id}" {if isset($formData['target_class_id']) && (int)$formData['target_class_id']==(int)$class['id']}selected{/if}>{$class.name}</option>{/volist}</select></div></div><div class="layui-form-item"><label class="layui-form-label">报名金额</label><div class="layui-input-block"><input type="number" name="enroll_amount" value="{$formData['enroll_amount']|default='0'}" class="layui-input" step="0.01"></div></div><div class="layui-form-item"><label class="layui-form-label">赠送课时</label><div class="layui-input-block"><input type="number" name="gift_hours" value="{$formData['gift_hours']|default='0'}" class="layui-input" step="0.01" min="0"></div></div><div class="layui-form-item"><label class="layui-form-label">付款状态</label><div class="layui-input-block"><select name="pay_status">{volist name="payStatusList" id="item"}<option value="{$item.value}" {if isset($formData['pay_status']) && (int)$formData['pay_status']==(int)$item['value']}selected{/if}>{$item.name}</option>{/volist}</select></div></div><div class="layui-form-item"><label class="layui-form-label">报名日期</label><div class="layui-input-block"><input type="date" name="enroll_date" value="{$formData['enroll_date']|default=''}" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status">{volist name="statusList" id="item" key="key"}<option value="{$key}" {if isset($formData['status']) && (int)$formData['status']==(int)$key}selected{/if}>{$item}</option>{/volist}</select><div class="layui-word-aux">只有“已报名 / 已完成”时才会把赠送课时累加</div></div></div><div class="layui-form-item layui-form-text"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea name="remark" class="layui-textarea">{$formData['remark']|default=''}</textarea></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="submit">保存</button><button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">取消</button></div></div></form></div></div>
<script>
layui.use(['form','layer','jquery'],function(){var form=layui.form,layer=layui.layer,$=layui.jquery;function setStudent(student){$('#student_id').val(student.id||'');$('#student_name_display').val(student.name||'');$('#contact_name').val(student.contact_name||'');$('#phone').val(student.phone||'');$('#source_class_id').val(student.class_id||'');$('#source_class_name').val(student.class_name||'');}function renderStudentPicker(list){var html='<div style="padding:12px;">';$.each(list,function(_,item){html+='<div class="search-result-item" data-id="'+(item.id||'')+'" data-name="'+(item.name||'')+'" data-contact="'+(item.contact_name||'')+'" data-phone="'+(item.phone||'')+'" data-class-id="'+(item.class_id||'')+'" data-class-name="'+(item.class_name||'')+'"><div style="font-weight:700;color:#111827;">'+(item.name||'')+'</div><div style="font-size:12px;color:#6b7280;margin-top:4px;">学号：'+(item.student_no||'')+'　班级：'+(item.class_name||'')+'</div></div>';});html+='</div>';layer.open({type:1,title:'请选择学生',area:['520px','420px'],content:html,success:function(layero,index){$(layero).find('.search-result-item').on('click',function(){setStudent({id:$(this).data('id'),name:$(this).data('name'),contact_name:$(this).data('contact'),phone:$(this).data('phone'),class_id:$(this).data('class-id'),class_name:$(this).data('class-name')});layer.close(index);});}});}function searchStudent(){var keyword=$.trim($('#student_keyword').val());if(!keyword){layer.msg('请输入学生姓名或学号',{icon:2});return;}$.get('/backend/edu/student/index',{keyword:keyword,page:1,limit:20},function(res){if(!res||!res.data||!res.data.length){layer.msg('没有找到该学生',{icon:2});return;}if(res.data.length===1){setStudent(res.data[0]);layer.msg('已自动选中学生',{icon:1});return;}renderStudentPicker(res.data);},'json').fail(function(){layer.msg('搜索失败，请稍后重试',{icon:2});});}$('#searchStudentBtn').on('click',searchStudent);$('#student_keyword').on('keydown',function(e){if((e.key&&e.key==='Enter')||e.keyCode===13){e.preventDefault();searchStudent();}});form.on('submit(submit)',function(data){if(!$.trim(data.field.student_id||'')){layer.msg('请先搜索并选择学生',{icon:2});return false;}$.post($('#form').attr('action'),data.field,function(res){if(res.code===1){layer.msg(res.msg,{icon:1},function(){parent.layer.closeAll();});}else{layer.msg(res.msg,{icon:2});}},'json');return false;});});
</script>
