{layout name="layout/main" /}
<div class="layui-card"><div class="layui-card-header"><h3 class="layui-card-title">查看续费报名</h3></div><div class="layui-card-body"><form class="layui-form layui-form-pane"><div class="layui-form-item"><label class="layui-form-label">报名单号</label><div class="layui-input-block"><input type="text" value="{$formData.enroll_no|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">学生</label><div class="layui-input-block"><input type="text" value="{$formData.student_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">联系人</label><div class="layui-input-block"><input type="text" value="{$formData.contact_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-block"><input type="text" value="{$formData.phone|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">报名类型</label><div class="layui-input-block"><input type="text" value="{$formData.enroll_type_text|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">原班级</label><div class="layui-input-block"><input type="text" value="{$formData.source_class_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">目标班级</label><div class="layui-input-block"><input type="text" value="{$formData.target_class_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">课程</label><div class="layui-input-block"><input type="text" value="{$formData.course_name|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">金额</label><div class="layui-input-block"><input type="text" value="{$formData.enroll_amount|default='0'}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">赠课</label><div class="layui-input-block"><input type="text" value="{$formData.gift_hours|default='0'}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">付款状态</label><div class="layui-input-block"><input type="text" value="{$formData.pay_status_text|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">报名日期</label><div class="layui-input-block"><input type="text" value="{$formData.enroll_date|default=''}" class="layui-input" readonly></div></div><div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><textarea class="layui-textarea" readonly>{$formData.remark|default=''}</textarea></div></div><div class="layui-form-item"><div class="layui-input-block"><button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">关闭</button></div></div></form></div></div>
