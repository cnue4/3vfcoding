{layout name="layout/main" /}
<style>
    #table + .layui-table-view .layui-table-tool-temp {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-right: 0;
    }

    #table + .layui-table-view .layui-table-tool-self {
        position: static;
        float: none;
        margin: 0;
        display: inline-flex;
        align-items: flex-end;
        align-self: flex-end;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline {
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn-container > * + * {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-inline + .layui-inline,
    #table + .layui-table-view .layui-table-tool-self .layui-btn + .layui-btn {
        margin-left: 8px;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn {
        height: 30px;
        line-height: 30px;
        padding: 0 10px;
        margin: 0;
    }

    #table + .layui-table-view .layui-table-tool-self .layui-btn .layui-icon {
        margin-right: 4px;
    }

    .table-batch-delete-disabled {
        opacity: .45;
        cursor: not-allowed;
        pointer-events: none;
    }

    .table-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
    }

    .table-action-group .layui-btn {
        margin: 0;
    }

    .enrollment-summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
    }

    @media (max-width: 768px) {
        .enrollment-summary-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
<div class="layui-card">
    <div class="layui-card-header"><h3 class="layui-card-title">续费报名</h3></div>
    <div class="layui-card-body">
        <div class="enrollment-summary-grid">
            <div class="layui-card"><div class="layui-card-body"><div>报名总数</div><div id="summaryCount" style="font-size:26px;font-weight:800;">0</div></div></div>
            <div class="layui-card"><div class="layui-card-body"><div>报名总金额</div><div id="summaryAmount" style="font-size:26px;font-weight:800;color:#16a34a;">0</div></div></div>
            <div class="layui-card"><div class="layui-card-body"><div>赠送总课时</div><div id="summaryHours" style="font-size:26px;font-weight:800;color:#2563eb;">0</div></div></div>
        </div>
        <div class="layui-form layui-form-pane" lay-filter="search"><div class="layui-form-item"><div class="layui-inline"><label class="layui-form-label">搜索</label><div class="layui-input-inline" style="width:280px;"><input type="text" name="keyword" placeholder="请输入单号、学生、联系人或电话" class="layui-input"></div></div><div class="layui-inline"><button class="layui-btn layui-btn-primary" lay-submit lay-filter="search"><i class="layui-icon layui-icon-search"></i> 搜索</button><button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset"><i class="layui-icon layui-icon-refresh"></i> 重置</button></div></div></div>
        <table class="layui-hide" id="table" lay-filter="table"></table>
    </div>
</div>
<script type="text/html" id="toolbar"><div class="layui-btn-container"><button class="layui-btn layui-btn-sm" lay-event="add"><i class="layui-icon layui-icon-add-circle"></i> 添加报名</button><button class="layui-btn layui-btn-sm layui-btn-danger table-batch-delete-disabled" lay-event="batchDelete" id="enrollmentBatchDeleteBtn"><i class="layui-icon layui-icon-delete"></i> 批量删除</button></div></script>
<script type="text/html" id="action"><div class="table-action-group"><button class="layui-btn layui-btn-xs" lay-event="view">查看</button><button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</button><button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button></div></script>
<script>
layui.use(['table','form','layer'],function(){
var table=layui.table,form=layui.form,layer=layui.layer,tableId='EduEnrollmentTable';
function relocateDefaultToolbar(){var $tableView=$('#table').next('.layui-table-view');var $toolbar=$tableView.find('.layui-table-tool-self');var $anchor=$('#enrollmentBatchDeleteBtn');if(!$tableView.length||!$toolbar.length||!$anchor.length){return;}$toolbar.insertAfter($anchor);} 
function renderSummary(extra){extra=extra||{};$('#summaryCount').text(extra.total_count||0);$('#summaryAmount').text(extra.total_amount||0);$('#summaryHours').text(extra.total_gift_hours||0);} 
function reload(reset,where){var options={};if(reset){options.page={curr:1};}if(where){options.where=where;}table.reload(tableId,options);} 
function openForm(title,url){layer.open({type:2,title:title,content:url,area:['980px','760px'],maxmin:true,end:function(){reload(false);}});} 
function updateBatchDeleteButtonState(){var selected=table.checkStatus(tableId).data||[];$('#enrollmentBatchDeleteBtn').toggleClass('table-batch-delete-disabled',!selected.length);} 
function deleteItems(ids,done,options){options=options||{};$.post('/backend/edu/edu_enrollment/delete',{ids:ids.join(',')},function(res){if(res.code===1){layer.msg(options.successText||res.msg||'删除成功',{icon:1},function(){reload(false);updateBatchDeleteButtonState();if(typeof done==='function')done(true);});}else{layer.msg((res&&res.msg)||'删除失败',{icon:2});if(typeof done==='function')done(false);}},'json').fail(function(){layer.msg('删除失败，请稍后重试',{icon:2});if(typeof done==='function')done(false);});}
table.render({elem:'#table',id:tableId,url:'/backend/edu/edu_enrollment/index',toolbar:'#toolbar',defaultToolbar:['filter','exports','print'],parseData:function(res){renderSummary((res.extra||{}).summary||{});return res;},cols:[[{type:'checkbox'},{field:'enroll_no',title:'报名单号',width:150},{field:'student_name',title:'学生',width:100},{field:'contact_name',title:'联系人',width:100},{field:'phone',title:'电话',width:120},{field:'enroll_type_text',title:'报名类型',width:110},{field:'source_class_name',title:'原班级',width:130},{field:'target_class_name',title:'目标班级',width:130},{field:'enroll_amount',title:'金额',width:100},{field:'gift_hours',title:'赠课',width:90},{field:'pay_status_text',title:'付款状态',width:100},{field:'enroll_date',title:'报名日期',width:110},{toolbar:'#action',title:'操作',width:180,fixed:'right'}]],page:true,limit:10,limits:[10,20,30,50],text:{none:'暂无数据'},done:function(){updateBatchDeleteButtonState();relocateDefaultToolbar();}});
table.on('toolbar(table)',function(obj){if(obj.event==='add'){openForm('添加报名','/backend/edu/edu_enrollment/add');}else if(obj.event==='batchDelete'){var selected=table.checkStatus(tableId).data||[];if(!selected.length){updateBatchDeleteButtonState();return;}var ids=selected.map(function(item){return item.id;});layer.confirm('确定要批量删除选中的 '+ids.length+' 条报名记录吗？',function(index){deleteItems(ids,function(){layer.close(index);},{successText:'已删除 '+ids.length+' 条数据'});});}});
table.on('checkbox(table)',function(){updateBatchDeleteButtonState();});
table.on('tool(table)',function(obj){var d=obj.data;if(obj.event==='view')openForm('查看报名','/backend/edu/edu_enrollment/view?id='+d.id);if(obj.event==='edit')openForm('编辑报名','/backend/edu/edu_enrollment/edit?id='+d.id);if(obj.event==='delete'){layer.confirm('确定删除吗？',function(i){deleteItems([d.id],function(){layer.close(i);});});}});
form.on('submit(search)',function(data){table.reload(tableId,{where:data.field,page:{curr:1}});return false;});
form.on('submit(reset)',function(){form.val('search',{keyword:''});table.reload(tableId,{where:{},page:{curr:1}});return false;});
});
</script>
