{layout name="layout/main" /}
<div class="layui-card">
    <div class="layui-card-header">
        <h3 class="layui-card-title">{if isset($formData['id'])}编辑班级{else}添加班级{/if}</h3>
    </div>
    <div class="layui-card-body">
        <form class="layui-form layui-form-pane" id="form"
              action="{if isset($formData['id']) && $formData['id']}/backend/edu/edu_class/edit?id={$formData['id']|default=''}{else}/backend/edu/edu_class/add{/if}"
              method="post">
            <input type="hidden" name="id" value="{$formData['id']|default=''}">

            <div class="layui-form-item">
                <label class="layui-form-label">班级编号</label>
                <div class="layui-input-block">
                    <input type="text" name="class_no" value="{$formData['class_no']|default=''}" class="layui-input" placeholder="自动生成" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">班级名称 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="name" value="{$formData['name']|default=''}" class="layui-input" placeholder="请输入班级名称" required lay-verify="required">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">课程 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <select name="course_id" lay-verify="required">
                        <option value="">请选择课程</option>
                        {volist name="courseList" id="course"}
                        <option value="{$course.id}" {if isset($formData['course_id']) && (int)$formData['course_id']==(int)$course.id}selected{/if}>{$course.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">教师 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <select name="teacher_id" lay-verify="required">
                        <option value="">请选择教师</option>
                        {volist name="teacherList" id="teacher"}
                        <option value="{$teacher.id}" {if isset($formData['teacher_id']) && (int)$formData['teacher_id']==(int)$teacher.id}selected{/if}>{$teacher.username}</option>
                        {/volist}
                    </select>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">教室 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="classroom" value="{$formData['classroom']|default=''}" class="layui-input" placeholder="请输入教室，如 A101" required lay-verify="required">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">最大人数 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="number" name="max_students" value="{$formData['max_students']|default=''}" class="layui-input" placeholder="请输入最大人数" min="1" required lay-verify="required">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">总课时 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="number" name="total_hours" value="{$formData['total_hours']|default='0'}" class="layui-input" placeholder="请输入总课时" min="0" step="0.01" required lay-verify="required">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">已用课时</label>
                <div class="layui-input-block">
                    <input type="number" name="used_hours_preview" value="{$formData['used_hours']|default='0'}" class="layui-input" placeholder="课时管理自动计算" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">剩余课时</label>
                <div class="layui-input-block">
                    <input type="number" name="remaining_hours_preview" value="{$formData['remaining_hours']|default='0'}" class="layui-input" placeholder="自动计算" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">上课星期 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <select name="class_weekday" lay-verify="required">
                        <option value="">请选择星期</option>
                        {volist name="weekdayList" id="weekdayName" key="weekdayValue"}
                        <option value="{$weekdayValue}" {if isset($formData['class_weekday']) && (int)$formData['class_weekday']==(int)$weekdayValue}selected{/if}>{$weekdayName}</option>
                        {/volist}
                    </select>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">开始时间 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="time" name="class_start_time" value="{$formData['class_start_time']|default=''}" class="layui-input" required lay-verify="required">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">结束时间 <span class="layui-form-must">*</span></label>
                <div class="layui-input-block">
                    <input type="time" name="class_end_time" value="{$formData['class_end_time']|default=''}" class="layui-input" required lay-verify="required">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">预览时间</label>
                <div class="layui-input-block">
                    <input type="text" name="class_time_preview" value="{$formData['class_time']|default=''}" class="layui-input" placeholder="自动生成" readonly>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="正常" {if !isset($formData['status']) || (int)$formData['status']==1}checked{/if}>
                    <input type="radio" name="status" value="0" title="结课" {if isset($formData['status']) && (int)$formData['status']==0}checked{/if}>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn layui-btn-normal" lay-submit lay-filter="submit">
                        <i class="layui-icon layui-icon-save"></i> 保存
                    </button>
                    <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.closeAll()">
                        <i class="layui-icon layui-icon-close"></i> 取消
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
    layui.use(['form', 'layer'], function() {
        var form = layui.form;
        var layer = layui.layer;
        var weekdayMap = {
            1: '星期一',
            2: '星期二',
            3: '星期三',
            4: '星期四',
            5: '星期五',
            6: '星期六',
            7: '星期天'
        };
        form.render();

        function formatNumber(value) {
            if (Number.isInteger(value)) {
                return value;
            }
            return value.toFixed(2).replace(/\.00$/, '');
        }

        function updatePreview() {
            var weekday = $('select[name="class_weekday"]').val();
            var startTime = $('input[name="class_start_time"]').val();
            var endTime = $('input[name="class_end_time"]').val();
            var text = '';
            if (weekday && startTime && endTime) {
                text = (weekdayMap[weekday] || '') + ' ' + startTime + '-' + endTime;
            }
            $('input[name="class_time_preview"]').val(text);
        }

        function updateHourPreview() {
            var total = parseFloat($('input[name="total_hours"]').val() || 0);
            var used = parseFloat($('input[name="used_hours_preview"]').val() || 0);
            var remaining = total - used;
            if (remaining < 0) {
                remaining = 0;
            }
            $('input[name="remaining_hours_preview"]').val(formatNumber(remaining));
        }

        function refreshParentAndClose(resetPage) {
            if (parent && typeof parent.__refreshEduClassTable === 'function') {
                parent.__refreshEduClassTable(!!resetPage);
            }
            if (parent && parent.layer) {
                var frameIndex = parent.layer.getFrameIndex(window.name);
                parent.layer.close(frameIndex);
            }
        }

        $('select[name="class_weekday"], input[name="class_start_time"], input[name="class_end_time"]').on('change input', function() {
            updatePreview();
        });
        $('input[name="total_hours"]').on('input', function() {
            updateHourPreview();
        });
        updatePreview();
        updateHourPreview();

        form.on('submit(submit)', function(data) {
            if (data.field.class_start_time >= data.field.class_end_time) {
                layer.msg('结束时间必须大于开始时间', {icon: 2});
                return false;
            }
            $.post($('#form').attr('action'), data.field, function(res) {
                if (res.code === 1) {
                    layer.msg(res.msg, {icon: 1}, function() {
                        refreshParentAndClose(false);
                    });
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            }, 'json');
            return false;
        });

        $(window).on('beforeunload', function() {
            if (parent && typeof parent.__refreshEduClassTable === 'function') {
                parent.__refreshEduClassTable(false);
            }
        });
    });
</script>
